services:
  # Backend API Web Service
  - type: web
    name: recoverai-backend
    runtime: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: recoverai-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
    healthCheckPath: /health

databases:
  # Free Managed PostgreSQL Database on Render
  - name: recoverai-db
    databaseName: recoverai
    user: recoverai_user
    plan: free
